<style>
:root{
  --bg:#0b0c0e;
  --bg-glow:#17191c;
  --line:#2b2e33;
  --line-strong:#3d4147;
  --text:#f3f3f1;
  --muted:#a1a5ab;
  --accent:#9db8ff;
  --danger-bg:#2a1718;
  --danger-line:#5a2b2d;
  --danger-text:#ffb4ab;
  --radius:16px;
  --font:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{background:var(--bg)}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(110% 60% at 50% 18%,var(--bg-glow) 0%,var(--bg) 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font);
  display:flex;
  justify-content:center;
  overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

.screen{
  width:min(100%,440px);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:28px 24px 36px;
}

/* ---------- الشعار المتحرك ---------- */
.orb{
  position:relative;
  width:min(80vw,300px,40vh);
  aspect-ratio:1;
  margin:0 auto;
}
.orb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#blobs{filter:url(#goo)}

.wordmark{
  margin:-20px 0 34px;
  text-align:center;
  direction:ltr;
}
.wordmark .name{
  display:block;
  font-size:22px;
  font-weight:500;
  letter-spacing:.46em;
  padding-left:.46em; /* يعوّض المسافة الأخيرة ليبقى الاسم في المنتصف */
  line-height:1.2;
}
.wordmark .tag{
  display:block;
  margin-top:10px;
  direction:rtl;
  font-size:16px;
  font-weight:500;
  letter-spacing:0; /* الحروف العربية يجب أن تبقى متصلة */
  color:var(--muted);
  opacity:.95;
}

/* ---------- النصوص ---------- */
.head{text-align:center;margin-bottom:30px}
h1{
  margin:0 0 12px;
  font-size:clamp(24px,6.6vw,30px);
  font-weight:700;
  line-height:1.3;
  letter-spacing:0;
}
.sub{
  margin:0 auto;
  max-width:34ch;
  color:var(--muted);
  font-size:16px;
  line-height:1.9;
}

/* ---------- الأزرار ---------- */
.actions{display:grid;gap:12px}
.btn{
  appearance:none;
  width:100%;
  min-height:56px;
  padding:0 20px;
  border-radius:var(--radius);
  font:inherit;
  font-size:17px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:12px;
  cursor:pointer;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s,border-color .15s,transform .1s;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:active{transform:scale(.985)}
.btn.sounding{box-shadow:0 0 0 2px var(--accent)}
.btn svg{width:22px;height:22px;flex:none}

.btn-primary{
  background:#f3f3f1;
  color:#17181a;
  border:1px solid #f3f3f1;
}
.btn-primary:hover{background:#fff}
.btn-primary[aria-busy="true"]{pointer-events:none;opacity:.75}
.btn-primary[aria-busy="true"] .g-icon{display:none}
.spinner{
  display:none;
  width:20px;height:20px;flex:none;
  border:2.5px solid #c9cacd;border-top-color:#17181a;
  border-radius:50%;
}
.btn-primary[aria-busy="true"] .spinner{display:block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .btn-primary[aria-busy="true"] .spinner{animation-duration:1.6s}
}

.btn-ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line-strong);
}
.btn-ghost:hover{background:#18191c;border-color:#565b62}

.divider{
  display:flex;align-items:center;gap:14px;
  margin:4px 0;
  color:var(--muted);font-size:14px;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- رسالة الخطأ ---------- */
.status{
  margin:20px 0 0;
  padding:14px 16px;
  display:flex;gap:10px;align-items:flex-start;
  background:var(--danger-bg);
  border:1px solid var(--danger-line);
  border-radius:12px;
  color:var(--danger-text);
  font-size:15px;line-height:1.7;
}
.status[hidden]{display:none}
.status svg{width:20px;height:20px;flex:none;margin-top:2px}

.foot{
  margin:28px 0 0;
  text-align:center;
  color:var(--muted);
  font-size:14px;line-height:1.8;
}

/* ---------- بطاقات الصور ---------- */
.showcase{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  margin:0 0 32px;
}
.card{
  display:flex;flex-direction:column;
  background:#121316;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
}
.card:nth-child(2){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .thumb{position:relative;aspect-ratio:1/1.05;overflow:hidden;background:#0e0f12}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb::after{
  content:"";position:absolute;inset:auto 0 0 0;height:45%;
  background:linear-gradient(to top,#121316,rgba(18,19,22,0));
}
.card .body{padding:2px 14px 16px;text-align:center}
.card .title{
  margin:0;
  font-family:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  font-size:21px;font-weight:600;line-height:1.3;
  letter-spacing:.01em;
}
.card .en{
  display:block;margin:4px 0 14px;
  direction:ltr;
  font-size:10px;letter-spacing:.34em;padding-left:.34em;
  color:var(--muted);text-transform:uppercase;
}
.more{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:40px;padding:0 20px;
  border:1px solid var(--line-strong);border-radius:999px;
  color:var(--text);text-decoration:none;
  font-size:14px;font-weight:600;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s,border-color .15s,transform .1s;
}
.more svg{width:15px;height:15px;transition:transform .15s}
.more:hover{background:#1c1e22;border-color:#565b62}
.more:hover svg{transform:translateX(-3px)}
.more:active{transform:scale(.97)}
.more.playing{background:#1c1e22;border-color:var(--accent);color:var(--accent)}
.more:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

@media (max-height:700px){
  .wordmark{margin-bottom:22px}
  .head{margin-bottom:22px}
}
</style>
</head>

<script>
/* ===== الشعار المتحرك: كرة زجاجية بوجه من الأرقام يتفكك ويتجمّع ===== */
(function () {
  var blobsCv = document.getElementById('blobs');
  var glassCv = document.getElementById('glass');
  if (!blobsCv || !glassCv || !blobsCv.getContext) return;
  var bx = blobsCv.getContext('2d');
  var gx = glassCv.getContext('2d');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CYCLE = 13;          // مدة الدورة بالثواني
  var S = 300, R = 100, DPR = 1;

  /* ---- شكل الوجه (كثافة 0..1 داخل كرة نصف قطرها 1) ---- */
  function density(u, v) {
    var d = 0;
    var hx = u / 0.29;
    var hy = (v + 0.2) / (v > -0.2 ? 0.4 : 0.36);
    d = Math.max(d, 1 - (hx * hx + hy * hy));
    if (v > 0.1 && v < 0.3) d = Math.max(d, (1 - Math.abs(u) / 0.15) * 0.75);
    if (v >= 0.22 && v < 0.68) {
      var t = (v - 0.22) / 0.46;
      var hw = 0.16 + 0.3 * Math.pow(t, 0.6);
      d = Math.max(d, (1 - Math.abs(u) / hw) * (1 - 0.5 * Math.pow(t, 3)) * 0.9);
    }
    return d;
  }

  function rnd() { return Math.random(); }
  function digit() { return String.fromCharCode(48 + Math.floor(rnd() * 10)); }

  var P = [];
  (function build() {
    var dx = 0.052, dy = 0.058, row = 0;
    for (var v = -0.58; v < 0.68; v += dy, row++) {
      for (var u = -0.46; u < 0.46; u += dx) {
        var uu = u + (row % 2 ? dx / 2 : 0);
        var d = density(uu, v);
        if (d < 0.06) continue;
        var ny = (v + 0.58) / 1.26;              // 0 أعلى .. 1 أسفل
        var rx = Math.max(-0.5, Math.min(0.5, uu * 0.9 + (rnd() - 0.5) * 0.5));
        var fs = 6.0 + (1 - ny) * 1.4 + rnd() * 0.5;
        P.push({
          hx: uu, hy: v, ch: digit(),
          a: Math.min(1, 0.28 + d * 1.1) * (0.55 + rnd() * 0.45),
          ph: rnd() * 6.28,
          fs: fs, fd: 0.8 + rnd() * 0.6,
          rs: 9.4 + ny * 0.9 + rnd() * 0.5, rd: 1.0 + rnd() * 0.5,
          rx: rx, ry: 0.6 + rnd() * 0.07 - Math.abs(rx) * 0.1
        });
      }
    }
  })();

  function pos(p, t) {
    if (t < p.fs) return [p.hx, p.hy, 1];
    if (t < p.fs + p.fd) {
      var e = (t - p.fs) / p.fd;
      return [p.hx + (p.rx - p.hx) * e * e * (3 - 2 * e), p.hy + (p.ry - p.hy) * e * e, 1 - 0.35 * e];
    }
    if (t < p.rs) {
      return [p.rx + Math.sin(t * 3 + p.ph) * 0.004, p.ry + Math.cos(t * 2.3 + p.ph) * 0.003, 0.65];
    }
    if (t < p.rs + p.rd) {
      var f = (t - p.rs) / p.rd;
      var k = f < 0.5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
      var sway = Math.sin(f * Math.PI) * 0.06 * Math.sin(p.ph * 3);
      return [p.rx + (p.hx - p.rx) * k + sway, p.ry + (p.hy - p.ry) * k, 0.65 + 0.35 * k];
    }
    return [p.hx, p.hy, 1];
  }

  /* ---- الفقاعات الجانبية التي تلتحم بالكرة ---- */
  var SAT = [
    { r: 0.38, d: 0.92, a0: -2.35, w: 0.16 },
    { r: 0.24, d: 1.04, a0: 0.25, w: -0.13 },
    { r: 0.16, d: 1.0, a0: -0.85, w: 0.21 }
  ];
  function satPos(s, i, time) {
    var a = s.a0 + s.w * time;
    var d = s.d + 0.06 * Math.sin(time * 0.7 + i * 2);
    return [S / 2 + Math.cos(a) * d * R, S / 2 + Math.sin(a) * d * R, s.r * R * (1 + 0.05 * Math.sin(time * 0.9 + i))];
  }

  function resize() {
    S = blobsCv.clientWidth || 300;
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    R = S * 0.34;
    [blobsCv, glassCv].forEach(function (c) { c.width = c.height = Math.round(S * DPR); });
    bx.setTransform(DPR, 0, 0, DPR, 0, 0);
    gx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function spec(ctx, x, y, r, alpha) {
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
    g.addColorStop(0.35, 'rgba(255,255,255,' + alpha * 0.35 + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }

  function render(t, time) {
    var c = S / 2, k = S / 300;
    var rr = R * (1 + 0.012 * Math.sin(time * 0.8));

    /* الطبقة 1: الأجسام الممتلئة (يلحمها مرشّح goo) */
    bx.clearRect(0, 0, S, S);
    var g1 = bx.createRadialGradient(c - rr * 0.35, c - rr * 0.4, rr * 0.05, c, c, rr);
    g1.addColorStop(0, '#2f3236');
    g1.addColorStop(1, '#1a1c1f');
    bx.fillStyle = g1;
    bx.beginPath(); bx.arc(c, c, rr, 0, 6.2832); bx.fill();
    var sp = SAT.map(function (s, i) { return satPos(s, i, time); });
    sp.forEach(function (s) {
      var g = bx.createRadialGradient(s[0] - s[2] * 0.3, s[1] - s[2] * 0.35, s[2] * 0.05, s[0], s[1], s[2]);
      g.addColorStop(0, '#3a3d42');
      g.addColorStop(1, '#202225');
      bx.fillStyle = g;
      bx.beginPath(); bx.arc(s[0], s[1], s[2], 0, 6.2832); bx.fill();
    });

    /* الطبقة 2: الأرقام والحواف واللمعان */
    gx.clearRect(0, 0, S, S);

    gx.save();
    gx.beginPath(); gx.arc(c, c, rr * 0.97, 0, 6.2832); gx.clip();
    gx.font = (R * 0.058).toFixed(2) + 'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
    gx.textAlign = 'center';
    gx.textBaseline = 'middle';
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (Math.random() < 0.004) p.ch = digit();
      var q = pos(p, t);
      var a = p.a * q[2] * (0.88 + 0.12 * Math.sin(time * 2 + p.ph));
      gx.fillStyle = 'rgba(236,236,236,' + a.toFixed(3) + ')';

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000}
body{font-family:Arial,sans-serif;color:#fff;overflow:hidden}
.app{height:100dvh;width:100%;background:#000;position:relative}
.main{height:calc(100dvh - 104px);overflow:auto;padding:25px 15px 30px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.empty{text-align:center;color:#777;margin-top:35vh;font-size:18px}
.bottom{
 position:absolute;left:0;right:0;bottom:0;height:104px;
 background:#000;border-top:2px solid #777;border-bottom:7px solid #505050;
 z-index:10
}
.nav{height:100%;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:7px 4px 7px}
.item{
 height:82px;color:#777;text-decoration:none;display:flex;flex-direction:column;
 align-items:center;justify-content:flex-end;gap:7px;font-size:17px;
 -webkit-tap-highlight-color:transparent
}
.item i{font-size:30px;height:34px;display:flex;align-items:center}
.item.active{color:#777}
.login{position:relative;color:#fff}
.loginCircle{
 position:absolute;top:-29px;width:61px;height:61px;border-radius:50%;
 background:#f50055;border:3px solid #000;display:flex;align-items:center;
 justify-content:center;box-shadow:0 0 0 1px #f50055
}
.loginCircle i{color:#fff;font-size:27px;height:auto}
.loginText{font-size:18px;color:#fff;margin-bottom:1px}
@media(max-width:390px){
 .item{font-size:15px}
 .item i{font-size:28px}
 .loginText{font-size:16px}
}
@media(min-width:700px){
 .app{max-width:430px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}
}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="empty">Home</div>
  </main>

  <footer class="bottom">
    <nav class="nav">
      <a class="item active" href="#">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a class="item" href="#">
        <i class="fa-solid fa-folder"></i>
        <span>Categories</span>
      </a>

      <a class="item login" href="#">
        <span class="loginCircle">
          <i class="fa-solid fa-right-to-bracket"></i>
        </span>
        <span class="loginText">login</span>
      </a>

      <a class="item" href="#">
        <i class="fa-solid fa-user-astronaut"></i>
        <span>Models</span>
      </a>

      <a class="item" href="#">
        <i class="fa-solid fa-video"></i>
        <span>Channels</span>
      </a>
    </nav>
  </footer>
</div>
</body>
</html>

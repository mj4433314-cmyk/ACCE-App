<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mobile App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  padding-bottom:92px;
}

.content{
  height:100%;
  overflow-y:auto;
  padding:28px 15px 110px;
  scrollbar-width:none;
}
.content::-webkit-scrollbar{display:none}

.demo-item{
  position:relative;
  min-height:310px;
  padding-top:24px;
}
.demo-item h2{
  margin:0 0 12px;
  font-size:27px;
  line-height:1.2;
  font-weight:700;
}
.demo-item p{
  margin:0;
  color:#888;
  font-size:21px;
}
.views{
  position:absolute;
  right:0;
  top:72px;
  color:#888;
  font-size:18px;
}
.views i{margin-right:8px}

.bottom-wrap{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:102px;
  background:#000;
  border-top:2px solid #777;
  border-bottom:7px solid #4d4d4d;
  z-index:20;
}

.bottom-nav{
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr 1fr;
  align-items:end;
  padding:9px 7px 8px;
}

.nav-item{
  position:relative;
  height:80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:7px;
  color:#777;
  text-decoration:none;
  font-size:17px;
  line-height:1;
  -webkit-tap-highlight-color:transparent;
}

.nav-item i{
  font-size:31px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.nav-item.login{
  color:#fff;
}

.login-circle{
  position:absolute;
  top:-30px;
  width:61px;
  height:61px;
  border-radius:50%;
  background:#f50055;
  display:flex;
  align-items:center;
  justify-content:center;
  border:3px solid #000;
  box-shadow:0 0 0 1px #f50055;
}

.login-circle i{
  color:#fff;
  font-size:28px;
  height:auto;
}

.login-text{
  margin-top:auto;
  margin-bottom:1px;
  font-size:18px;
  color:#fff;
}

@media(max-width:390px){
  .nav-item{font-size:15px}
  .nav-item i{font-size:28px}
  .login-text{font-size:16px}
}

@media(min-width:700px){
  .app{max-width:430px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}
}
</style>
</head>
<body>
<div class="app">

  <main class="content">
    <section class="demo-item">
      <div class="views"><i class="fa-solid fa-eye"></i>19.5K</div>
      <h2>Well-Proportioned Video</h2>
      <p>Content</p>
    </section>

    <section class="demo-item">
      <div class="views"><i class="fa-solid fa-eye"></i>38.0K</div>
      <h2>Featured Content</h2>
      <p>Content</p>
    </section>

    <section class="demo-item">
      <div class="views"><i class="fa-solid fa-eye"></i>7.2K</div>
      <h2>Latest Video</h2>
      <p>Content</p>
    </section>
  </main>

  <div class="bottom-wrap">
    <nav class="bottom-nav">

      <a href="#" class="nav-item" onclick="return false;">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a href="#" class="nav-item" onclick="return false;">
        <i class="fa-solid fa-folder"></i>
        <span>Categories</span>
      </a>

      <a href="#" class="nav-item login" onclick="return false;">
        <span class="login-circle">
          <i class="fa-solid fa-right-to-bracket"></i>
        </span>
        <span class="login-text">login</span>
      </a>

      <a href="#" class="nav-item" onclick="return false;">
        <i class="fa-solid fa-user-astronaut"></i>
        <span>Models</span>
      </a>

      <a href="#" class="nav-item" onclick="return false;">
        <i class="fa-solid fa-video"></i>
        <span>Channels</span>
      </a>

    </nav>
  </div>
</div>
</body>
</html>
